<!doctype html>
<html lang="en" class="dark bg-slate-50 dark:bg-[#030d17]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <title>ReharmPro - AI Harmonic Substitution Engine</title>
    <meta name="description" content="Programmatic harmonic generator and reharmonization engine." />
    <meta property="og:title" content="ReharmPro - AI Harmonic Substitution Engine" />
    <meta property="og:description" content="Programmatic harmonic generator and reharmonization engine." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#030d17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReharmPro" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/index.css" />
    <script>
      window.ReharmEngine = window.ReharmEngine || new Proxy({}, {
        get: function(target, prop) {
          if (prop in target) return target[prop];
          if (prop === 'setBpm') {
            return function(val) {
              var badge = document.getElementById('bpmBadgeText');
              if (badge) badge.textContent = String(val);
            };
          }
          return function() {};
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-[#030d17] text-slate-900 dark:text-[#f8fafc] h-[100dvh] max-h-[100dvh] overflow-hidden flex flex-col antialiased selection:bg-sky-500 selection:text-white dark:selection:bg-[#38bdf8] dark:selection:text-slate-900 transition-colors duration-200">

    <!-- TOP MINIMAL HEADER -->
    <header class="shrink-0 z-30 bg-slate-50 dark:bg-[#030d17] px-4 py-3 flex items-center justify-between max-w-lg mx-auto w-full transition-colors">
      <!-- Save Current Progression Button -->
      <button id="saveCurrentProgBtn" type="button" onclick="window.ReharmEngine.toggleSaveCurrentProgression()" class="p-2 rounded-[6px] text-slate-500 hover:text-sky-600 dark:text-[#38bdf8]/70 dark:hover:text-[#38bdf8] transition-colors cursor-pointer" title="Save Progression">
        <span id="saveProgIcon">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>
        </span>
      </button>

      <!-- Right Controls: PWA Install + Dark Mode Toggle -->
      <div class="flex items-center gap-1">
        <button id="pwaInstallBtn" type="button" onclick="window.ReharmEngine.triggerPWAInstall()" class="hidden p-2 rounded-[6px] text-slate-500 hover:text-sky-600 dark:text-[#38bdf8]/70 dark:hover:text-[#38bdf8] transition-colors cursor-pointer" title="Install App">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
        </button>
        <button type="button" onclick="window.ReharmEngine.toggleTheme()" class="p-2 rounded-[6px] text-slate-500 hover:text-slate-900 dark:text-[#38bdf8]/70 dark:hover:text-white transition-colors cursor-pointer" title="Toggle Light/Dark Theme">
          <span id="themeIcon">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
          </span>
        </button>
      </div>
    </header>

    <!-- MAIN VIEWPORT CONTAINER (SWIPE LEFT FOR SAVED PROGRESSIONS, SWIPE RIGHT FOR RANDOMIZER) -->
    <div id="mainContainer" class="flex-1 min-h-0 w-full max-w-lg mx-auto overflow-hidden select-none relative bg-slate-50 dark:bg-[#030d17] transition-colors">
      <div id="screenTrack" class="w-[200%] h-full flex transition-transform duration-300 ease-out translate-x-0">
        
        <!-- SCREEN 1: GENERATOR / RANDOMIZER VIEW -->
        <div id="generatorView" class="w-1/2 h-full px-4 py-3 flex flex-col justify-between gap-4 shrink-0 bg-slate-50 dark:bg-[#030d17] transition-colors">

          <!-- 1. TOP AREA: SINGLE PROGRESSION OUTPUT (2 MEASURES PER LINE) -->
          <div id="reharmOutputContainer" class="flex-1 min-h-0 flex flex-col items-center justify-center my-auto w-full px-1 py-2 overflow-y-auto no-scrollbar box-border" style="touch-action: pan-y;">
            <!-- Populated dynamically -->
          </div>

          <!-- 2. CONTROL SECTION (3 ROWS: TRANSPORT BAR ABOVE, OPTIONS + REHARM + RANDOMIZE MIDDLE, FULL-WIDTH INPUT BELOW) -->
          <div class="flex flex-col gap-2 w-full mt-auto pt-3 border-t border-slate-200/90 dark:border-[#0c4a6e]/50 shrink-0 relative">

            <!-- ROW 0: DEDICATED TRANSPORT BAR (PLAY/STOP + TEMPO SLIDER + BPM + EP SELECTOR + LOOP) -->
            <div class="relative w-full">
              <!-- FLOATING DROPDOWN FOR ELECTRIC PIANO SOUND SELECTION -->
              <div id="epPopover" class="hidden absolute bottom-full right-4 mb-2 z-50 w-52 bg-white dark:bg-[#071d2c] border border-slate-300 dark:border-[#38bdf8]/50 rounded-[10px] shadow-2xl p-1.5 flex flex-col gap-1">
                <!-- Populated dynamically -->
              </div>

              <div id="transportControls" class="w-full flex items-center bg-white dark:bg-[#071d2c] border border-slate-300/90 dark:border-[#0c4a6e]/70 rounded-[8px] shadow-sm overflow-hidden">
                <button id="playProgBtn" type="button" onclick="window.ReharmEngine.togglePlayback()" class="px-3.5 py-2.5 text-slate-900 dark:text-white hover:text-sky-600 dark:hover:text-[#38bdf8] hover:bg-slate-100 dark:hover:bg-[#0c4a6e]/40 border-r border-slate-200 dark:border-[#0c4a6e]/60 shrink-0 cursor-pointer active:scale-95 transition-all flex items-center justify-center" title="Play / Stop">
                  <span id="playProgIcon" class="flex items-center justify-center">
                    <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                  </span>
                </button>

                <div class="flex-1 flex items-center gap-2.5 px-3 py-2 min-w-0">
                  <input id="bpmRangeInput" type="range" min="60" max="200" step="2" value="104" oninput="window.ReharmEngine.setBpm(this.value)" class="flex-1 min-w-0 accent-sky-600 dark:accent-[#38bdf8] cursor-pointer h-1.5 bg-slate-200 dark:bg-[#030d17] rounded-lg" title="Tempo (BPM)" />
                  <span id="bpmBadgeText" class="font-mono-tabular font-black text-[12px] text-slate-700 dark:text-[#f8fafc] w-7 text-right shrink-0 select-none">104</span>
                </div>

                <!-- QUICK-TAP ELECTRIC PIANO SELECTOR INSIDE TEMPO CONTROLS -->
                <div class="relative shrink-0 flex items-center border-l border-slate-200 dark:border-[#0c4a6e]/60">
                  <button id="epSelectorBtn" type="button" onclick="window.ReharmEngine.cycleEPModel()" oncontextmenu="event.preventDefault(); window.ReharmEngine.toggleEPPopover(event)" class="px-2.5 py-2.5 text-sky-600 dark:text-[#38bdf8] hover:bg-slate-100 dark:hover:bg-[#0c4a6e]/40 shrink-0 cursor-pointer active:scale-95 transition-all flex items-center gap-1 select-none" title="Electric Piano: Tap to cycle | Hold for styles">
                    <span id="epBadgeText" class="font-mono-tabular font-black text-[11px] tracking-tight uppercase">Rhodes</span>
                  </button>
                </div>

                <button id="loopToggleBtn" type="button" onclick="window.ReharmEngine.toggleLoop()" class="px-3.5 py-2.5 border-l border-slate-200 dark:border-[#0c4a6e]/60 shrink-0 cursor-pointer active:scale-95 transition-all flex items-center justify-center text-sky-600 dark:text-[#38bdf8] bg-sky-500/10 dark:bg-[#0c4a6e]/60" title="Toggle Loop">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
                </button>
              </div>
            </div>

            <!-- ROW 1: REHARM TECHNIQUE (25% FAR LEFT) + RANDOMIZE (75% RIGHT) -->
            <div class="grid grid-cols-4 gap-2 w-full relative">
              <!-- FLOATING CARD FOR REHARM SET SELECTION (OPENED ON 0.25-SECOND HOLD OF REHARM BUTTON) -->
              <div id="reharmSetPopover" class="hidden absolute bottom-full left-0 mb-2 z-50 w-44 bg-white dark:bg-[#071d2c] border border-slate-300 dark:border-[#38bdf8]/50 rounded-[10px] shadow-xl p-1.5 flex flex-col gap-1">
                <button type="button" id="setBtnBasic" onclick="window.ReharmEngine.selectReharmSet('basic')" class="w-full px-3 py-2 rounded-[7px] flex items-center justify-between text-xs font-mono-tabular font-extrabold transition-colors cursor-pointer">
                  <span>Basic</span>
                  <span class="text-[11px] opacity-80">V⁷</span>
                </button>
                <button type="button" id="setBtnDark" onclick="window.ReharmEngine.selectReharmSet('dark')" class="w-full px-3 py-2 rounded-[7px] flex items-center justify-between text-xs font-mono-tabular font-extrabold transition-colors cursor-pointer">
                  <span>Dark</span>
                  <span class="text-[11px] opacity-80">♭vi</span>
                </button>
              </div>

              <!-- FLOATING DROPDOWN FOR REHARM CATEGORY / TECHNIQUE SELECTION (OPENED ON TAP OF REHARM BUTTON) -->
              <div id="reharmTechniquePopover" class="hidden absolute bottom-full left-0 mb-2 z-50 w-64 max-h-64 overflow-y-auto no-scrollbar bg-white dark:bg-[#071d2c] border border-slate-300 dark:border-[#38bdf8]/50 rounded-[10px] shadow-2xl p-1.5 flex flex-col gap-1">
                <!-- Populated dynamically -->
              </div>

              <!-- REHARM TECHNIQUE BUTTON (TAP = DROPDOWN, 0.25S HOLD = REHARM SET FLOATING CARD) -->
              <div id="reharmBtnWrapper" class="col-span-1 relative flex items-center justify-center" oncontextmenu="event.preventDefault()">
                <button id="reharmVisualBtn" type="button" class="w-full h-full py-3 px-2 bg-white dark:bg-[#071d2c] hover:bg-slate-50 dark:hover:bg-[#0c4a6e]/50 border border-slate-300/90 dark:border-[#0c4a6e]/70 rounded-[8px] focus:outline-none cursor-pointer shadow-sm flex items-center justify-center transition-all select-none" title="Tap: Reharm Category | Hold 0.25s: Set (Basic / Dark)">
                  <span id="reharmIconBadge" class="font-mono-tabular font-black text-[16px] leading-none text-sky-600 dark:text-[#38bdf8] tracking-tight select-none pointer-events-none">I</span>
                </button>
              </div>

              <!-- RANDOMIZE BUTTON (75% WIDTH) -->
              <button type="button" onclick="window.ReharmEngine.randomize()" class="col-span-3 py-3 px-3 bg-sky-600 hover:bg-sky-700 dark:bg-[#0c4a6e] dark:hover:bg-[#073652] active:scale-[0.98] text-white dark:text-[#38bdf8] rounded-[8px] border border-sky-700/20 dark:border-[#38bdf8]/30 shadow-sm flex items-center justify-center cursor-pointer transition-all" title="Randomize Reharm">
                <svg class="w-[18px] h-[18px] text-white dark:text-[#38bdf8]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
              </button>
            </div>

              <!-- ROW 2: FULL WIDTH INPUT FIELD WITH INTEGRATED MINIMAL METER & SYMBOL KEYS -->
            <div class="w-full flex items-center bg-white dark:bg-[#071d2c] border border-slate-300/90 dark:border-[#0c4a6e]/70 rounded-[8px] focus-within:ring-2 focus-within:ring-sky-500/40 dark:focus-within:ring-[#38bdf8]/40 shadow-sm overflow-hidden">
              <button type="button" onclick="window.ReharmEngine.toggleMeter()" id="meterToggleBtn" class="px-2.5 py-3.5 font-mono-tabular font-black text-[13px] text-sky-600 dark:text-[#38bdf8] hover:bg-slate-100 dark:hover:bg-[#0c4a6e]/40 border-r border-slate-200 dark:border-[#0c4a6e]/60 shrink-0 cursor-pointer active:scale-95 transition-all select-none" title="Toggle 3/4 or 4/4">4/4</button>
              <input id="singleProgInput" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" oninput="window.ReharmEngine.handleInputChange()" placeholder="G | D | Em | C" class="flex-1 min-w-0 py-3.5 px-2.5 bg-transparent text-[14px] font-mono-tabular font-extrabold text-slate-900 dark:text-[#f8fafc] placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none text-center truncate" />
              <div class="flex items-center border-l border-slate-200 dark:border-[#0c4a6e]/60 shrink-0">
                <button type="button" onmousedown="event.preventDefault()" onclick="window.ReharmEngine.insertInputSymbol('/')" class="px-2.5 py-3.5 font-mono-tabular font-black text-[14px] text-slate-600 dark:text-slate-300 hover:text-sky-600 dark:hover:text-[#38bdf8] hover:bg-slate-100 dark:hover:bg-[#0c4a6e]/40 cursor-pointer active:scale-90 transition-all select-none" title="Insert /">/</button>
                <button type="button" onmousedown="event.preventDefault()" onclick="window.ReharmEngine.insertInputSymbol('|')" class="px-2.5 py-3.5 font-mono-tabular font-black text-[14px] text-slate-600 dark:text-slate-300 hover:text-sky-600 dark:hover:text-[#38bdf8] hover:bg-slate-100 dark:hover:bg-[#0c4a6e]/40 border-l border-slate-200 dark:border-[#0c4a6e]/40 cursor-pointer active:scale-90 transition-all select-none" title="Insert |">|</button>
              </div>
            </div>
          </div>

        </div>

        <!-- SCREEN 2: SAVED PROGRESSIONS VIEW (SWIPE LEFT TO OPEN, SWIPE RIGHT OR TAP CARD TO RETURN) -->
        <div id="savedView" class="w-1/2 h-full px-4 py-3 flex flex-col justify-between gap-4 shrink-0 bg-slate-50 dark:bg-[#030d17] transition-colors">
          
          <!-- SAVED PROGRESSIONS LIST / 1FR 1FR SQUARE SECTIONS -->
          <div id="savedProgressionsList" class="flex-1 min-h-0 w-full overflow-y-auto no-scrollbar flex flex-col gap-3 py-1" style="touch-action: pan-y;">
            <!-- Populated dynamically -->
          </div>

          <!-- BOTTOM INPUT BAR TO TYPE & SAVE PROGRESSIONS DIRECTLY ON SAVED SCREEN -->
          <div class="flex flex-col gap-2 w-full mt-auto pt-3 border-t border-slate-200/90 dark:border-[#0c4a6e]/50 shrink-0">
            <div class="w-full flex items-center bg-white dark:bg-[#071d2c] border border-slate-300/90 dark:border-[#0c4a6e]/70 rounded-[8px] focus-within:ring-2 focus-within:ring-sky-500/40 dark:focus-within:ring-[#38bdf8]/40 shadow-sm overflow-hidden">
              <input id="savedProgInput" type="text" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" oninput="window.ReharmEngine.handleModalInputFormat(this)" onkeydown="if(event.key === 'Enter') window.ReharmEngine.addSavedProgressionFromInput()" placeholder="G | D | Em | C" class="flex-1 min-w-0 py-3.5 px-3 bg-transparent text-[14px] font-mono-tabular font-extrabold text-slate-900 dark:text-[#f8fafc] placeholder:text-slate-400 dark:placeholder:text-slate-500 focus:outline-none text-center truncate" />
              <div class="flex items-center border-l border-slate-200 dark:border-[#0c4a6e]/60 shrink-0">
                <button type="button" onmousedown="event.preventDefault()" onclick="window.ReharmEngine.insertSavedInputSymbol('/')" class="px-2.5 py-3.5 font-mono-tabular font-black text-[14px] text-slate-600 dark:text-slate-300 hover:text-sky-600 dark:hover:text-[#38bdf8] hover:bg-slate-100 dark:hover:bg-[#0c4a6e]/40 cursor-pointer active:scale-90 transition-all select-none" title="Insert /">/</button>
                <button type="button" onmousedown="event.preventDefault()" onclick="window.ReharmEngine.insertSavedInputSymbol('|')" class="px-2.5 py-3.5 font-mono-tabular font-black text-[14px] text-slate-600 dark:text-slate-300 hover:text-sky-600 dark:hover:text-[#38bdf8] hover:bg-slate-100 dark:hover:bg-[#0c4a6e]/40 border-l border-slate-200 dark:border-[#0c4a6e]/40 cursor-pointer active:scale-90 transition-all select-none" title="Insert |">|</button>
                <button type="button" onclick="window.ReharmEngine.addSavedProgressionFromInput()" class="px-3.5 py-3.5 bg-sky-600 hover:bg-sky-700 dark:bg-[#0c4a6e] dark:hover:bg-[#073652] text-white dark:text-[#38bdf8] border-l border-sky-700/20 dark:border-[#38bdf8]/30 cursor-pointer active:scale-95 transition-all flex items-center justify-center" title="Save">
                  <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                </button>
              </div>
            </div>
          </div>

        </div>

      </div>
    </div>

    <!-- MINIMAL IOS INSTALL MODAL -->
    <div id="iosInstallModal" onclick="if(event.target === this) window.ReharmEngine.closeIOSInstallModal()" class="fixed inset-0 z-50 bg-slate-900/50 dark:bg-slate-950/75 backdrop-blur-md flex items-center justify-center p-4 hidden">
      <div class="bg-white dark:bg-[#071d2c] border border-slate-300 dark:border-[#0c4a6e] rounded-[16px] p-5 w-full max-w-xs shadow-2xl flex flex-col items-center gap-3 text-center">
        <img src="/icon.svg" alt="ReharmPro" class="w-12 h-12 rounded-[10px]" referrerpolicy="no-referrer" />
        <p class="font-mono-tabular text-xs font-bold text-slate-700 dark:text-slate-200 leading-relaxed">
          Tap <span class="text-sky-600 dark:text-[#38bdf8]">Share</span> then <span class="text-sky-600 dark:text-[#38bdf8]">Add to Home Screen</span>
        </p>
        <button type="button" onclick="window.ReharmEngine.closeIOSInstallModal()" class="w-full py-2 rounded-[8px] bg-slate-100 dark:bg-[#030d17] text-xs font-mono-tabular font-bold text-slate-700 dark:text-[#38bdf8] border border-slate-300 dark:border-[#0c4a6e]/60 cursor-pointer">
          OK
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
